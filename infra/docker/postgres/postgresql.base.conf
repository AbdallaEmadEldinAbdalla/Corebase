# Corebase per-project Postgres — Free-tier baseline (512 MiB cgroup).
# Values the fleet depends on are commented with the decision that fixed them.

listen_addresses = '*'
port = 5432
# No data_directory here on purpose: it comes from PGDATA in the container spec.
# The volume is mounted at /var/lib/postgresql/data and PGDATA is a subdirectory
# of it (the mount root can hold lost+found, which initdb refuses), so pinning a
# path in the shared config file guarantees a mismatch on the first boot.

# ── connections ────────────────────────────────────────────────────────────
# 20 total, budgeted 3 superuser-reserved / 7 PostgREST / 8 pooler / 2 direct (D-074)
max_connections = 20
superuser_reserved_connections = 3

# ── memory (fits a 512 MiB container) ──────────────────────────────────────
shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
temp_buffers = 8MB

# ── WAL / archiving: on from first boot so backups and future CDC never
#    require a restart (D-019 archiving, D-125 wal_level) ───────────────────
wal_level = logical
max_wal_senders = 4
max_replication_slots = 4
max_slot_wal_keep_size = 1GB          # slot-lag hard cap (D-126)
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300                 # Free tier: ≤5 min RPO (D-077, D-148)
wal_compression = on
min_wal_size = 80MB
max_wal_size = 512MB
checkpoint_completion_target = 0.9

# ── safety rails ───────────────────────────────────────────────────────────
statement_timeout = 60000             # 60s; noisy-neighbour control (D-055)
idle_in_transaction_session_timeout = 300000
lock_timeout = 10000

# ── observability ──────────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 1000
pg_stat_statements.track = top
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000     # slow-query source for the index advisor
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d %a '
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0

# ── locale / misc ──────────────────────────────────────────────────────────
timezone = 'UTC'
datestyle = 'iso, mdy'
password_encryption = scram-sha-256
