# Staging Prometheus. In production this is the mon-1 node with http_sd targets
# served by the control plane (D-146); here the two platform services are static.
global:
  scrape_interval: 5s          # 15s in production; 5s so a drill finishes fast
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # host.docker.internal: the API and worker run as host processes in local
  # staging, not containers. In production they are containers on the node and
  # come from http_sd like everything else.
  - job_name: steadhold-api
    static_configs:
      - targets: ['host.docker.internal:8099']
        labels: { service: api }

  - job_name: steadhold-worker
    static_configs:
      - targets: ['host.docker.internal:9101']
        labels: { service: worker }

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
