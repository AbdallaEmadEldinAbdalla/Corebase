# Milestone 0 · T2 — staging infrastructure, Docker edition.
#
# The plan calls for Terraform + two Hetzner nodes. We reproduce the same
# TOPOLOGY locally so no step is skipped and nothing is paid for:
#
#   control node  →  control-db (control-plane Postgres, D-012)
#                    control-redis (BullMQ queue + rate limits, D-018)
#   data node     →  data-node: Docker-in-Docker exposing the Engine API over
#                    TLS on :2376. This is the real interface the worker will
#                    drive in production — the worker manages nodes via the
#                    Docker Engine API over mTLS, with no per-node agent (D-052).
#
# What this substitution does NOT prove: cloud-init, real network partitions,
# NVMe behaviour, XFS project quotas, or Hetzner-specific failure modes. Those
# stay open until a real node exists (OQ-165).
name: corebase-staging

services:
  control-db:
    image: postgres:17.5-bookworm
    container_name: cb-control-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:-controlpass}
      POSTGRES_DB: corebase_control
      POSTGRES_USER: corebase
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
    ports:
      - "${CONTROL_DB_PORT:-55433}:5432"
    volumes:
      - control-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebase -d corebase_control"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-redis:
    image: redis:7.4-alpine
    container_name: cb-control-redis
    restart: unless-stopped
    # appendonly so a restart does not silently lose queued jobs; the job row in
    # Postgres is still the source of truth (D-018/D-067), this is belt and braces
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${CONTROL_REDIS_PORT:-56379}:6379"
    volumes:
      - control-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  data-node:
    # stands in for a Hetzner data node running project containers
    image: docker:29-dind
    container_name: cb-data-node
    restart: unless-stopped
    privileged: true                     # required for dind; the real node runs dockerd natively
    environment:
      DOCKER_TLS_CERTDIR: /certs         # dockerd generates CA + server + client certs here
    ports:
      - "${DATA_NODE_PORT:-2376}:2376"   # Engine API, TLS only — never 2375
      # Project database ports. On a real node these are published by dockerd on
      # the node's own address and reached over the private network; dind puts
      # them in its own namespace, so the range has to be republished to be
      # reachable from the control plane running on the host.
      #
      # Thirty ports, not the fleet's thousand (PG_PORT_RANGE): enough to hold
      # T5f's twenty simultaneous projects with headroom, while publishing 1000
      # through Docker Desktop's proxy would cost seconds of startup and a
      # process per port for no extra coverage. CB_PG_PORT_MIN/MAX narrow the
      # allocator to match — see placement.ts.
      - "${PROJECT_PORT_MIN:-5433}-${PROJECT_PORT_MAX:-5462}:5433-5462"
    volumes:
      - data-node-certs:/certs
      - data-node-docker:/var/lib/docker
      - ./certs:/certs/client-out        # certs copied out for the worker/host to use
    healthcheck:
      test: ["CMD-SHELL", "docker -H tcp://127.0.0.1:2376 --tlsverify --tlscacert /certs/server/ca.pem --tlscert /certs/server/cert.pem --tlskey /certs/server/key.pem info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── monitoring (T9) ─────────────────────────────────────────────────────
  # Production runs these on a separate mon-1 node with R2-backed storage
  # (D-146/D-147). Locally they sit beside the control node; what is being
  # rehearsed is the label discipline and the queries, not the topology.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: cb-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # The API and worker are host processes in local staging; in production
      # they are containers discovered through http_sd.
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.3.2
    container_name: cb-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: cb-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.river
    volumes:
      - ./monitoring/alloy.river:/etc/alloy/config.river:ro
      - ./monitoring/logs:/logs:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: cb-grafana
    restart: unless-stopped
    environment:
      # Anonymous admin: this is a local staging stack with no real data in it,
      # and a password prompt between an engineer and a dashboard during a drill
      # is friction with no security value here. Production is behind SSO.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]

volumes:
  control-db-data:
  control-redis-data:
  data-node-certs:
  data-node-docker:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
