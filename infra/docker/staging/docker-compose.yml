# Milestone 0 · T2 — staging infrastructure, Docker edition.
#
# The plan calls for Terraform + two Hetzner nodes. We reproduce the same
# TOPOLOGY locally so no step is skipped and nothing is paid for:
#
#   control node  →  control-db (control-plane Postgres, D-012)
#                    control-redis (BullMQ queue + rate limits, D-018)
#   data node     →  data-node: Docker-in-Docker exposing the Engine API over
#                    TLS on :2376. This is the real interface the worker will
#                    drive in production — the worker manages nodes via the
#                    Docker Engine API over mTLS, with no per-node agent (D-052).
#
# What this substitution does NOT prove: cloud-init, real network partitions,
# NVMe behaviour, XFS project quotas, or Hetzner-specific failure modes. Those
# stay open until a real node exists (OQ-165).
# The compose project name, which is what Docker Desktop and `docker ps` group by.
# Plain `corebase`: this is the only stack the repo runs locally, so the "-staging"
# suffix distinguished it from nothing and just made every container name longer.
name: corebase

services:
  control-db:
    image: postgres:17.5-bookworm
    container_name: cb-control-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:-controlpass}
      POSTGRES_DB: corebase_control
      POSTGRES_USER: corebase
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
    ports:
      - "${CONTROL_DB_PORT:-55433}:5432"
    volumes:
      - control-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebase -d corebase_control"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-redis:
    image: redis:7.4-alpine
    container_name: cb-control-redis
    restart: unless-stopped
    # appendonly so a restart does not silently lose queued jobs; the job row in
    # Postgres is still the source of truth (D-018/D-067), this is belt and braces
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${CONTROL_REDIS_PORT:-56379}:6379"
    volumes:
      - control-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  data-node:
    # stands in for a Hetzner data node running project containers
    image: docker:29-dind
    container_name: cb-data-node
    restart: unless-stopped
    privileged: true                     # required for dind; the real node runs dockerd natively
    environment:
      DOCKER_TLS_CERTDIR: /certs         # dockerd generates CA + server + client certs here
    # An explicit address pool, sized for the density this phase is aiming at.
    #
    # dockerd's built-in default carves /16s out of 172.17–172.31, which is about
    # fifteen networks — and inside dind most of those collide with routes the outer
    # engine already holds, so in practice a handful. With a network per project
    # (D-228) that ceiling arrives long before RAM does: the node answered
    # "all predefined address pools have been fully subnetted" with three networks
    # on it, which would have looked like a mysterious provisioning failure at
    # around the tenth project rather than the hundredth.
    #
    # 10.201.0.0/16 in /24s gives 256 project networks, which comfortably clears
    # D-091's 150-active-per-node design maximum, and 10.201 is chosen to sit
    # outside both Docker Desktop's ranges and the usual corporate 10.0/10.1 space.
    command:
      - --default-address-pool=base=10.201.0.0/16,size=24
    ports:
      - "${DATA_NODE_PORT:-2376}:2376"   # Engine API, TLS only — never 2375
      # Project database ports. On a real node these are published by dockerd on
      # the node's own address and reached over the private network; dind puts
      # them in its own namespace, so the range has to be republished to be
      # reachable from the control plane running on the host.
      #
      # Thirty ports by default, not the fleet's thousand (PG_PORT_RANGE): enough
      # to hold T5f's twenty simultaneous projects with headroom, while publishing
      # 1000 through Docker Desktop's proxy would cost seconds of startup and a
      # process per port for no extra coverage. CB_PG_PORT_MIN/MAX narrow the
      # allocator to match — see placement.ts.
      #
      # Both sides of the mapping use the same variables, and must: the
      # container-side range was pinned to 5433-5462 while the host side was
      # parameterised, so widening the range for P2g's density run failed with
      # "invalid ranges specified for container and host Ports" — the two sides
      # have to be the same width, and there is no reason for them to differ at
      # all when the allocator is narrowed to match. P2g runs with
      # PROJECT_PORT_MAX=5532 and POOLER_PORT_MAX=6532 for 100 projects.
      - "${PROJECT_PORT_MIN:-5433}-${PROJECT_PORT_MAX:-5462}:${PROJECT_PORT_MIN:-5433}-${PROJECT_PORT_MAX:-5462}"
      # And the pooler range (P2b). A project is two listeners now: Postgres on
      # its port for DIRECT_DATABASE_URL, PgBouncer on its own for DATABASE_URL.
      # Without this published, nothing on the host — control plane or customer —
      # can reach a pooler, and the health gate would fail for a pooler that is
      # actually running perfectly.
      - "${POOLER_PORT_MIN:-6433}-${POOLER_PORT_MAX:-6462}:${POOLER_PORT_MIN:-6433}-${POOLER_PORT_MAX:-6462}"
    volumes:
      - data-node-certs:/certs
      - data-node-docker:/var/lib/docker
    healthcheck:
      test: ["CMD-SHELL", "docker -H tcp://127.0.0.1:2376 --tlsverify --tlscacert /certs/server/ca.pem --tlscert /certs/server/cert.pem --tlskey /certs/server/key.pem info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── object storage (P3a) ────────────────────────────────────────────────
  # Stands in for Cloudflare R2 (D-017/D-023), which is what production uses and
  # what this must never become a paid dependency of during development. MinIO
  # speaks the same S3 API pgBackRest talks, which is the whole interface.
  #
  # Reachability is the interesting part, and it works the way production works
  # rather than by a shortcut. A project container lives on its own private
  # per-project network inside the data node (D-070/D-228) and reaches this
  # through the node's NAT egress — exactly as a real node reaches R2 over the
  # internet. Nothing is attached to a shared network, so no project gains a
  # route to another; verified by curling the health endpoint from a container on
  # a fresh private network inside the node.
  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cb-object-store
    restart: unless-stopped
    # TLS, because pgBackRest speaks S3 over HTTPS and has no plain-HTTP option:
    # `repo1-storage-verify-tls=n` relaxes *verification*, not the protocol. R2 is
    # TLS-only too, so serving HTTPS here is the substitute being faithful rather
    # than a workaround — the certs are generated by ./scripts/staging.sh
    # backup-store and mounted read-only.
    command: ["server", "/data", "--console-address", ":9001", "--certs-dir", "/certs"]
    environment:
      MINIO_ROOT_USER: ${BACKUP_ACCESS_KEY:-corebase-backup}
      MINIO_ROOT_PASSWORD: ${BACKUP_SECRET_KEY:-corebase-backup-secret}
      # Off by default: the console is a convenience for a human looking at
      # objects, and one fewer listener is one fewer thing to secure by accident.
      MINIO_BROWSER: ${MINIO_BROWSER:-on}
    ports:
      - "${OBJECT_STORE_PORT:-59000}:9000"
      - "${OBJECT_STORE_CONSOLE_PORT:-59001}:9001"
    volumes:
      - object-store-data:/data
      - ./object-store-certs:/certs:ro
    healthcheck:
      test: ["CMD", "mc", "--insecure", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ── monitoring (T9) ─────────────────────────────────────────────────────
  # Production runs these on a separate mon-1 node with R2-backed storage
  # (D-146/D-147). Locally they sit beside the control node; what is being
  # rehearsed is the label discipline and the queries, not the topology.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: cb-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # The API and worker are host processes in local staging; in production
      # they are containers discovered through http_sd.
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.3.2
    container_name: cb-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: cb-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.river
    volumes:
      - ./monitoring/alloy.river:/etc/alloy/config.river:ro
      - ./monitoring/logs:/logs:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: cb-grafana
    restart: unless-stopped
    environment:
      # Anonymous admin: this is a local staging stack with no real data in it,
      # and a password prompt between an engineer and a dashboard during a drill
      # is friction with no security value here. Production is behind SSO.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]

volumes:
  control-db-data:
  object-store-data:
  control-redis-data:
  data-node-certs:
  data-node-docker:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
