# Phase 1 exit criterion 3: "CI runs unit + integration suites green on every PR."
#
# Two jobs, and the split is deliberate. `unit` needs nothing but Node, so it
# answers in about a minute and catches most mistakes. `integration` stands up the
# whole staging substitute — control Postgres, Redis, a Docker-in-Docker data node
# driven over mTLS — and runs the suites that talk to it.
#
# The integration suites do not skip when their infrastructure is missing; they
# fail, loudly, with the command that fixes it. That rule exists because a
# silently-skipped suite once hid a real bug behind a green run, and CI is exactly
# where that would happen again.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# On a branch, a new push supersedes the in-flight run: the old answer is about code
# nobody will merge. On `main` it does not — see below.
concurrency:
  # On `main`, group by **commit** so runs never queue behind each other. Grouping
  # by ref and merely disabling cancellation was the first attempt, and it traded
  # one wrong answer for another: instead of killing the previous run, the new one
  # sat `pending` for nineteen minutes and GitHub shows no status icon at all for a
  # queued run — so the latest commit looked as though CI had never triggered.
  # A group per SHA means every commit on main gets its own run, immediately, and
  # none of them can cancel another.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Cancel superseded runs on branches, never on `main`.
  #
  # `cancel-in-progress: true` everywhere is right for a branch — nobody cares
  # whether an overwritten commit was green. On `main` it means the opposite: this
  # lane takes about nineteen minutes, so any two pushes closer together than that
  # leave the earlier commit with **no verdict at all**, and the run shows as
  # "cancelled" rather than as anything you can act on. Three consecutive pushes
  # did exactly that, and the history of main was unverified while looking busy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'

jobs:
  unit:
    name: typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No `version` here on purpose: package.json's `packageManager` field is
      # the single source of truth, and pnpm/action-setup fails outright when both
      # name a version. Pinning it twice is how the two drift.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: build
        # The dashboard is a Next.js app: `tsc --noEmit` is happy about plenty of
        # things `next build` refuses, from a client hook in a server component to
        # a page that cannot prerender. A page that does not build is broken, and
        # this is the cheapest place to find out.
        run: pnpm build
      - name: unit tests (no infrastructure)
        # Pointed at dead ports on purpose: if anything in this lane reaches for a
        # database, it must fail here rather than pass by accident on a runner
        # that happens to have one.
        env:
          SH_CONTROL_DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/none
          SH_REDIS_URL: redis://127.0.0.1:1
        run: pnpm test:unit

  # ── the release gate (D-085, D-162) ────────────────────────────────────────
  #
  # Proposal §74 — create projects A and B, prove A cannot touch B, run it
  # continuously — is the single most important test in this repository, because
  # tenant isolation is risk #1. **A failure here freezes all releases**, not just
  # the change that caused it: while isolation is provably broken we cannot reason
  # about which change is safe to ship.
  #
  # D-162 puts this gate in place the week Phase 5 starts rather than at launch,
  # on the reasoning that retrofitting a security gate never happens under launch
  # pressure. This is that week.
  #
  # Its own job rather than a lane in the matrix above, for three reasons: it is a
  # *gate* and should be legible as one in the checks list; its fixtures are two
  # whole projects and it must not share a node with suites that truncate the same
  # tables; and it must never be sharded, because a shard that silently holds no
  # files reports green.
  isolation:
    name: tenant isolation (release gate)
    runs-on: ubuntu-latest
    # The whole suite provisions six containers once and reuses them, so this is
    # setup-dominated rather than test-dominated.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: infra/docker/postgres
          tags: steadhold/postgres:17.5
          load: true
          cache-from: type=gha
      - uses: docker/build-push-action@v7
        with:
          context: infra/docker/pgbouncer
          tags: steadhold/pgbouncer:1.23
          load: true
          cache-from: type=gha
      - uses: docker/build-push-action@v7
        with:
          context: infra/docker/postgrest
          tags: steadhold/postgrest:12.2
          load: true
          cache-from: type=gha

      - name: bring up the staging substitute
        run: ./scripts/staging.sh up
      - name: migrate, master key, application role
        run: |
          ./scripts/migrate-staging.sh
          ./scripts/staging.sh kek
          ./scripts/staging.sh app-role
      - name: seed the project images onto the data node
        run: ./scripts/staging.sh seed-images
      - name: object store — the one destination egress must still allow
        run: ./scripts/staging.sh backup-store
      - name: egress default-deny on the data node
        # NET-3 and NET-4 assert exactly what this applies. Without it they fail,
        # which is the correct behaviour: the suite tests the platform's posture,
        # not the platform's intentions.
        run: ./scripts/staging.sh harden-egress

      - name: the isolation matrix
        # No `--passWithNoTests`, unlike every other lane. A gate that passes when
        # it found nothing to run is not a gate — and this is the one suite where
        # "no tests ran" and "no attack succeeded" must never look the same.
        run: pnpm --filter @steadhold/isolation-tests exec vitest run --reporter=basic

      - name: what a failure here means
        if: failure()
        run: |
          echo '::error::TENANT ISOLATION FAILED — this freezes all releases (D-085).'
          echo 'A red isolation suite is Sev-1. Any test returning another project'\''s'
          echo 'rows or bytes is the highest severity there is.'
          echo
          echo 'The freeze is fleet-wide and covers every pending change, not only'
          echo 'the one that turned this red: while isolation is provably broken we'
          echo 'cannot reason about which change is safe to ship. It lifts when this'
          echo 'job is green again.'
          echo
          echo 'An isolation test may never be marked flaky-skip. A nondeterministic'
          echo 'one is itself a Sev-2 bug — in the test or in the boundary. Fix it or'
          echo 'remove it, never mute it.'

  integration:
    # Sharded because the lane was sixteen minutes of almost entirely one thing:
    # ~130 tests that each provision a real Postgres container, at ~6s of `initdb`
    # and health-gating apiece. Nothing was hanging — that is just the arithmetic.
    #
    # Sharded with vitest's own `--shard` rather than hand-written file lists. A
    # list would drift, and the failure mode of a drifting list here is the worst
    # available one: a file that silently stops running is indistinguishable from a
    # file that passes. `--shard` puts every file in exactly one shard by
    # construction, so it cannot.
    #
    # `api` rides the same matrix rather than a second job, so the stack setup
    # below exists once. Two copies of it would be two things to keep in step, and
    # this lane's last two failures were both caused by exactly that kind of drift.
    name: integration (${{ matrix.lane }})
    runs-on: ubuntu-latest
    # 35, raised from 20 after a shard was **cancelled** rather than failed: it was
    # still making progress at 20m32s and got killed, which reads in the UI like a
    # broken suite and is not one. 20 was right for the arithmetic above and stopped
    # being right when Phase 4 added ~65 tests to a single file — and a *file* is
    # the sharder's smallest unit, so the slowest file sets the floor for whichever
    # shard holds it. The durable fix is to stop provisioning a project per test
    # (STATUS §8); this is the number being right-sized, not the problem being
    # papered over.
    timeout-minutes: 35
    strategy:
      # Every shard runs even when one fails: stopping the others turns "one suite
      # is broken" into "some unknown subset is broken".
      fail-fast: false
      matrix:
        # Six, not four. More shards do not make the slowest *file* faster, but
        # they stop it sharing a shard with three other slow ones — which is what
        # actually blew the budget.
        lane: [worker-1, worker-2, worker-3, worker-4, worker-5, worker-6, api]
    steps:
      - uses: actions/checkout@v7
      # No `version` here on purpose: package.json's `packageManager` field is
      # the single source of truth, and pnpm/action-setup fails outright when both
      # name a version. Pinning it twice is how the two drift.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `cache-to: type=gha` is not supported by buildx's default *docker* driver,
      # which is what a runner has out of the box — the build fails outright with
      # "Cache export is not supported for the docker driver". setup-buildx-action
      # creates a docker-container builder, which supports both the GitHub cache
      # and `load: true` into the local image store.
      - uses: docker/setup-buildx-action@v4

      - name: build the project database image
        # The same image the worker puts on a data node: the extension allowlist
        # (D-078) and the auth hardening (D-185) are enforced at build time, so a
        # regression in either fails here rather than on a customer's database.
        uses: docker/build-push-action@v7
        with:
          context: infra/docker/postgres
          tags: steadhold/postgres:17.5
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build the project pooler image
        # A project is two containers since P2b, and `seed-images` refuses to run
        # with only one of them built — a node missing the pooler image fails deep
        # inside provisioning rather than at create time.
        uses: docker/build-push-action@v7
        with:
          context: infra/docker/pgbouncer
          tags: steadhold/pgbouncer:1.23
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build the project data-API image
        # Third container per project since P5b (D-011). `seed-images` refuses to
        # run without it, which is how this omission surfaced — as a red CI on the
        # commit that added the requirement rather than as a mystery timeout deep
        # in provisioning.
        uses: docker/build-push-action@v7
        with:
          context: infra/docker/postgrest
          tags: steadhold/postgrest:12.2
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: bring up the staging substitute
        run: ./scripts/staging.sh up

      - name: migrate, master key, application role
        run: |
          ./scripts/migrate-staging.sh
          ./scripts/staging.sh kek
          ./scripts/staging.sh app-role

      - name: seed the project image onto the data node
        run: ./scripts/staging.sh seed-images

      # Phase 3's suites all refuse to run without an object store, on purpose
      # (D-223: a suite that needs infrastructure fails rather than skips). This
      # step was missing from the moment the object store was added in P3a, so
      # every backup, restore, verification and destruction test failed its
      # precondition here while passing locally — the exact gap the "verified live"
      # rule exists to close, missed because the README was updated and this file
      # was not.
      #
      # After `seed-images`, not before: its egress probe runs a container from the
      # project image on the node, and without the image it fails claiming the
      # network is unreachable.
      - name: object store — bucket, TLS, and egress from a project network
        run: ./scripts/staging.sh backup-store

      # D-081's egress default-deny. After `backup-store`, which is not an
      # ordering nicety: the allowlist needs the object store's address, and
      # applying the deny without it would block WAL archiving — a failure that is
      # slow, silent and looks like a backup bug rather than a firewall one.
      - name: egress default-deny on the data node
        run: ./scripts/staging.sh harden-egress

      # The email sink (P4d). Its own step for the same reason backup-store is
      # one: it emits the environment the sender needs and it *proves the path* —
      # an SMTP conversation that ends with the message visible in the sink, not
      # a port check. A listening socket that rejects EHLO looks identical to a
      # working sink until the first send fails.
      #
      # Adding a suite without adding its setup step is the mistake that left
      # every Phase 3 suite red in CI for five steps while passing locally, so
      # this goes in with the code that needs it.
      - name: email sink — SMTP reachable and accepting
        run: ./scripts/staging.sh mail-sink

      - name: verify the substitute is actually usable
        # Ten checks including "plaintext :2375 refused" and "node can run a
        # project container". A green suite on a half-up stack is worth nothing.
        run: ./scripts/staging.sh verify

      # The guard on the sharding itself. Only `worker` and `api` have `.e2e.` files,
      # which is why those are the only lanes — and if a third package ever grows
      # one, this lane would silently never run it while the unit lane excludes it
      # by pattern. That is a test nobody runs and nobody misses, so it fails here
      # instead.
      - name: nothing still carries the pre-rename prefix
        # This guard has now been widened twice, and each time for the same reason:
        # it encoded the shapes somebody had thought of.
        #
        #  1. D-412 swept CB_/cb-/cb_ — so `cb:` and `cb.` survived, in Redis key
        #     prefixes (`cb:session:`) and browser storage keys (`cb.csrf`).
        #  2. D-422 added those — and `cbp_`, `cbi_`, `cbk_` still survived,
        #     because the character after `cb` was a letter. Those were the
        #     *credential* prefixes: personal access tokens, invite tokens, and
        #     the JWT key id in every project's JWKS (D-433).
        #
        # So the pattern is now "cb, then up to six alphanumerics, then a
        # separator", which is the shape of a prefix rather than a list of the
        # ones already found. A false positive costs one exclusion; a false
        # negative cost two rounds of this.
        run: |
          # One legitimate reason to write the old name remains: code whose
          # job is to *remove* the old thing from a host provisioned before
          # the rename. Such a line carries a `pre-rename` marker, which has
          # to be typed deliberately and says why it is there.
          #
          # `migrations/` is excluded for a reason the marker cannot express: an
          # applied migration is checksummed by the runner, so its bytes are
          # immutable and a rename *cannot* reach it. Demanding one there demands
          # exactly what `packages/migrate` refuses — which is how the prefix
          # rename broke `migrate-staging.sh` for six commits (D-456). Prose about
          # a column that may need renaming belongs in `COMMENT ON`, which a later
          # migration can replace; the immutability itself is guarded by
          # `packages/migrate/src/immutable.test.ts`.
          hits="$(git grep -nIE '\b[cC][bB][a-zA-Z0-9]{0,6}[-_.:]' \
            -- ':!STATUS.md' ':!docs/00-foundation/05-decision-log.md' \
               ':!.github/workflows/ci.yml' ':!migrations' \
            | grep -v 'pre-rename' || true)"
          if [ -n "$hits" ]; then
            echo "These still carry the pre-rename prefix (D-412, D-422, D-433):"
            echo "$hits"
            exit 1
          fi
          echo "✓ no pre-rename prefix outside the docs that describe the rename"

      - name: no package outside worker/api has infrastructure tests
        run: |
          stray="$(git ls-files '*.e2e.test.ts' \
                   | grep -v '^services/worker/' | grep -v '^services/api/' || true)"
          if [ -n "$stray" ]; then
            echo "These e2e tests are in no integration lane, so nothing runs them:"
            echo "$stray"
            echo "Add a lane to .github/workflows/ci.yml's matrix, or move them."
            exit 1
          fi
          echo "✓ every .e2e.test.ts lives in a package this matrix covers"
          # The symmetric half, for the isolation suite. Its files are
          # `.isolation.test.ts` and are run by the `isolation` job below, not by
          # this matrix — so one written anywhere else would be a *release gate*
          # that nothing runs, which is strictly worse than a missing test because
          # the gate would report green.
          strayiso="$(git ls-files '*.isolation.test.ts' | grep -v '^tests/isolation/' || true)"
          if [ -n "$strayiso" ]; then
            echo "These isolation tests are outside tests/isolation, so the gate never runs them:"
            echo "$strayiso"
            exit 1
          fi
          echo "✓ every .isolation.test.ts is inside the release gate"

      - name: run this lane
        run: |
          LANE='${{ matrix.lane }}'
          # Declared once. The matrix above and the divisor here have to agree, and
          # they are six lines apart in a file nobody reads top to bottom — a
          # mismatch would silently never run a slice of the suite, which is the
          # exact failure `--shard` was chosen to make impossible.
          WORKER_SHARDS=6
          matrix_workers=$(grep -o 'worker-[0-9]' .github/workflows/ci.yml | sort -u | wc -l | tr -d ' ')
          if [ "$matrix_workers" != "$WORKER_SHARDS" ]; then
            echo "The matrix has $matrix_workers worker lanes and the divisor says $WORKER_SHARDS."
            echo "They must agree, or a slice of the suite runs in no lane at all."
            exit 1
          fi
          case "$LANE" in
            worker-*)
              # `--shard=i/n` over the worker's files. The pure packages are not
              # run here at all: their tests contain no `.e2e.` files, so the unit
              # lane already covers every one of them.
              pnpm --filter @steadhold/worker exec vitest run --shard="${LANE#worker-}/${WORKER_SHARDS}"
              ;;
            api)
              pnpm --filter @steadhold/api test
              ;;
            *)
              echo "unknown lane $LANE"; exit 1 ;;
          esac

      - name: what the stack looked like, if anything failed
        if: failure()
        run: |
          ./scripts/staging.sh status || true
          docker logs sh-control-db --tail 50 || true
          docker logs sh-data-node --tail 50 || true

      - name: tear down
        if: always()
        run: ./scripts/staging.sh nuke || true
