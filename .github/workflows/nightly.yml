# The harnesses that are too slow for a pull request but too important to run only
# by hand: the crash-resume kill matrix (T6), the lifecycle residue loop (T7) and
# the node-reboot drill (T8).
#
# Each is a done-signal for a Milestone-0 task, and each takes minutes rather than
# seconds — 11 kill points at ~35s, 20 create/delete cycles, a node restart. On a
# schedule they stay honest; on every PR they would just get disabled.
name: Nightly drills

on:
  schedule:
    - cron: '17 3 * * *'      # off the hour, so a fleet of repos does not stampede
  workflow_dispatch:

jobs:
  drills:
    # One job per drill, not four steps in one, and this is the fix for the flaw
    # that made this workflow useless rather than merely red.
    #
    # Steps in a job are sequential and skip once one fails. T6 broke in P3a, and
    # for four nights T7, T8 and T5f reported "skipped" — which reads as "not
    # reached" and is indistinguishable from "never once run". When T6 was
    # repaired, all three failed immediately, two of them for T6's own reasons and
    # T5f for a missing import it had held since it was written. A signal that
    # hides three other signals behind it is worse than no signal.
    #
    # A fresh runner each is also more faithful than sharing one. These drills are
    # heavy — 11 provisions, 20 create+delete cycles, a node restart, 20
    # consecutive creates — and by the fourth the runner's Docker was failing with
    # "driver failed programming external connectivity", which is bridge and port
    # state exhausted by the three before it. Production does not run four drills
    # on one node either.
    name: ${{ matrix.drill.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every drill runs even when one fails. That is the whole point of the split.
      fail-fast: false
      matrix:
        drill:
          - { name: 'T6 — crash-resume kill matrix', task: kill-matrix }
          - { name: 'T7 — lifecycle residue loop',   task: lifecycle }
          - { name: 'T8 — node reboot drill',        task: node-reboot }
          - { name: 'T5f — provisioning measurement', task: bench }
          # P5f. Nightly rather than per-PR, per the testing strategy: it wants a
          # quiet machine and thirty seconds of sustained load, and neither
          # belongs in the path of a pull request. Its blocking assertions are the
          # hardware-independent ones — error rate, RLS correctness, and the
          # gateway's *added* cost measured against a direct arm on the same box.
          # The absolute p50/p99 are reported and not enforced here, because a
          # shared runner is not a production node (D-388).
          - { name: 'P5f — data-plane latency budget', task: load }
    steps:
      - uses: actions/checkout@v7
      # No `version` here on purpose: package.json's `packageManager` field is
      # the single source of truth, and pnpm/action-setup fails outright when both
      # name a version. Pinning it twice is how the two drift.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # See ci.yml: the default docker driver cannot export a cache.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: infra/docker/postgres
          tags: steadhold/postgres:17.5
          load: true
          cache-from: type=gha

      - uses: docker/build-push-action@v7
        with:
          context: infra/docker/pgbouncer
          tags: steadhold/pgbouncer:1.23
          load: true
          cache-from: type=gha

      - uses: docker/build-push-action@v7
        with:
          context: infra/docker/postgrest
          tags: steadhold/postgrest:12.2
          load: true
          cache-from: type=gha

      - name: bring up the staging substitute
        run: |
          ./scripts/staging.sh up
          ./scripts/migrate-staging.sh
          ./scripts/staging.sh kek
          ./scripts/staging.sh app-role
          ./scripts/staging.sh seed-images
          ./scripts/staging.sh backup-store
          ./scripts/staging.sh mail-sink
          ./scripts/staging.sh verify

      # Each drill asserts its own invariants and exits non-zero on failure, so
      # there is nothing to check here beyond letting them run.
      - name: ${{ matrix.drill.name }}
        run: pnpm --filter @steadhold/worker ${{ matrix.drill.task }}

      # Only T5f writes it, so only T5f has anything to print. In the other three
      # jobs this used to cat a file the checkout happened to contain, which is
      # the committed measurement rather than anything the run produced —
      # numbers-for-the-record that were not this run's numbers.
      - name: numbers, for the record
        if: always() && matrix.drill.task == 'bench'
        run: cat docs/14-roadmap/measurements/m-002-provisioning.json || true

      - name: latency, for the record
        if: always() && matrix.drill.task == 'load'
        run: cat docs/14-roadmap/measurements/p5f-latency.json || true

      - name: tear down
        if: always()
        run: ./scripts/staging.sh nuke || true
